{% extends "base.html" %}
{% block title %}{{ 'Add' if mode == 'new' else 'Modify' }} announcement - University of Boumerdes{% endblock %}

{% block content %}
<section class="section">
  <div class="container narrow">
    <h1>{{ 'Add an announcement' if mode == 'new' else 'Modify announcement' }}</h1>

    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="title">Title</label>
      <input type="text" id="title" name="title" maxlength="200" required value="{{ form.title }}">

      <label for="content">Content</label>
      <textarea id="content" name="content" rows="10" required>{{ form.content }}</textarea>

      <p class="actions">
        <button type="submit" class="btn">Save</button>
        <a class="btn btn-light" href="{{ url_for('announcements') }}">Cancel</a>
      </p>
    </form>
  </div>
</section>
{% endblock %}
